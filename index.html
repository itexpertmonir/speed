<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Professional Internet Speed Test</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b1020;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 900px;
    background: #11182d;
    border: 1px solid #26304d;
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 25px 70px rgba(0,0,0,.45);
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.header p {
    color: #94a3b8;
}

.speedometer {
    width: 300px;
    height: 300px;
    margin: 20px auto;
    border-radius: 50%;
    background:
        radial-gradient(circle, #11182d 55%, transparent 56%),
        conic-gradient(
            #2563eb 0deg,
            #06b6d4 70deg,
            #22c55e 140deg,
            #eab308 210deg,
            #ef4444 280deg,
            #334155 280deg
        );
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

.speedometer::before {
    content: "";
    position: absolute;
    inset: 18px;
    border-radius: 50%;
    background: #11182d;
}

.speed-content {
    position: relative;
    text-align: center;
    z-index: 2;
}

.speed {
    font-size: 55px;
    font-weight: bold;
}

.speed-unit {
    color: #94a3b8;
    font-size: 18px;
}

.status {
    text-align: center;
    color: #38bdf8;
    min-height: 25px;
    margin: 15px 0;
}

.start-btn {
    display: block;
    margin: 20px auto;
    width: 250px;
    padding: 16px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(135deg,#2563eb,#06b6d4);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

.start-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(37,99,235,.35);
}

.start-btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.results {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 15px;
    margin-top: 25px;
}

.card {
    background: #18213b;
    border: 1px solid #293654;
    border-radius: 16px;
    padding: 22px;
    text-align: center;
}

.icon {
    font-size: 30px;
    margin-bottom: 10px;
}

.card-title {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 8px;
}

.card-value {
    font-size: 25px;
    font-weight: bold;
}

.info {
    margin-top: 20px;
    background: #18213b;
    border-radius: 16px;
    padding: 20px;
}

.info-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #293654;
}

.info-row:last-child {
    border-bottom: none;
}

.info-label {
    color: #94a3b8;
}

.info-value {
    font-weight: bold;
    text-align: right;
}

.footer {
    text-align: center;
    margin-top: 20px;
    color: #64748b;
    font-size: 13px;
}

@media(max-width:650px) {

    .container {
        padding: 20px;
    }

    .header h1 {
        font-size: 25px;
    }

    .speedometer {
        width: 240px;
        height: 240px;
    }

    .speed {
        font-size: 45px;
    }

    .results {
        grid-template-columns: 1fr;
    }

    .start-btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🌐 Internet Speed Test</h1>
        <p>আপনার ইন্টারনেটের আসল গতি পরীক্ষা করুন</p>
    </div>

    <div class="speedometer">

        <div class="speed-content">

            <div class="speed" id="mainSpeed">
                0
            </div>

            <div class="speed-unit">
                Mbps
            </div>

        </div>

    </div>

    <div class="status" id="status">
        Test শুরু করার জন্য বাটনে ক্লিক করুন
    </div>

    <button
        class="start-btn"
        id="startBtn"
        onclick="startTest()">

        🚀 START TEST

    </button>


    <div class="results">

        <div class="card">

            <div class="icon">📡</div>

            <div class="card-title">
                PING
            </div>

            <div class="card-value" id="ping">
                -- ms
            </div>

        </div>


        <div class="card">

            <div class="icon">⬇️</div>

            <div class="card-title">
                DOWNLOAD
            </div>

            <div class="card-value" id="download">
                -- Mbps
            </div>

        </div>


        <div class="card">

            <div class="icon">⬆️</div>

            <div class="card-title">
                UPLOAD
            </div>

            <div class="card-value" id="upload">
                -- Mbps
            </div>

        </div>

    </div>


    <div class="info">

        <div class="info-row">

            <span class="info-label">
                🌍 Public IP
            </span>

            <span
                class="info-value"
                id="ip">

                Loading...

            </span>

        </div>


        <div class="info-row">

            <span class="info-label">
                🏢 ISP
            </span>

            <span
                class="info-value"
                id="isp">

                Loading...

            </span>

        </div>


        <div class="info-row">

            <span class="info-label">
                📍 Location
            </span>

            <span
                class="info-value"
                id="location">

                Loading...

            </span>

        </div>


        <div class="info-row">

            <span class="info-label">
                💻 Browser
            </span>

            <span
                class="info-value"
                id="browser">

                Loading...

            </span>

        </div>

    </div>


    <div class="footer">
        Professional Internet Speed Test
    </div>

</div>


<script>

/* =========================================
   GET IP / ISP INFORMATION
========================================= */

async function getNetworkInfo() {

    try {

        const response =
            await fetch("https://ipapi.co/json/");

        const data =
            await response.json();

        document.getElementById("ip").textContent =
            data.ip || "Unknown";

        document.getElementById("isp").textContent =
            data.org || "Unknown";

        document.getElementById("location").textContent =
            (data.city || "Unknown") +
            ", " +
            (data.country_name || "");

    }

    catch(error) {

        document.getElementById("ip").textContent =
            "Unavailable";

        document.getElementById("isp").textContent =
            "Unavailable";

        document.getElementById("location").textContent =
            "Unavailable";

    }

}


/* =========================================
   BROWSER INFORMATION
========================================= */

function getBrowserInfo() {

    const ua = navigator.userAgent;

    let browser = "Unknown";

    if (ua.includes("Edg")) {

        browser = "Microsoft Edge";

    }

    else if (ua.includes("Chrome")) {

        browser = "Google Chrome";

    }

    else if (ua.includes("Firefox")) {

        browser = "Mozilla Firefox";

    }

    else if (ua.includes("Safari")) {

        browser = "Safari";

    }

    document.getElementById("browser").textContent =
        browser;

}


/* =========================================
   PING TEST
========================================= */

async function pingTest() {

    const start =
        performance.now();

    try {

        await fetch(
            "https://www.cloudflare.com/cdn-cgi/trace",
            {
                cache: "no-store"
            }
        );

        const end =
            performance.now();

        const ping =
            Math.round(end - start);

        document.getElementById("ping").textContent =
            ping + " ms";

        return ping;

    }

    catch(error) {

        document.getElementById("ping").textContent =
            "N/A";

        return 0;

    }

}


/* =========================================
   DOWNLOAD TEST
========================================= */

async function downloadTest() {

    const size =
        10 * 1024 * 1024;

    const start =
        performance.now();

    try {

        const response =
            await fetch(
                "https://speed.cloudflare.com/__down?bytes=" + size,
                {
                    cache: "no-store"
                }
            );

        const blob =
            await response.blob();

        const end =
            performance.now();

        const seconds =
            (end - start) / 1000;

        const bits =
            blob.size * 8;

        const mbps =
            bits / seconds / 1024 / 1024;

        return mbps;

    }

    catch(error) {

        console.error(error);

        return 0;

    }

}


/* =========================================
   UPLOAD TEST
========================================= */

async function uploadTest() {

    const size =
        3 * 1024 * 1024;

    const data =
        new Uint8Array(size);

    crypto.getRandomValues(
        data.subarray(0, 65536)
    );

    const start =
        performance.now();

    try {

        await fetch(
            "https://speed.cloudflare.com/__up",
            {
                method: "POST",
                body: data,
                cache: "no-store"
            }
        );

        const end =
            performance.now();

        const seconds =
            (end - start) / 1000;

        const bits =
            size * 8;

        const mbps =
            bits / seconds / 1024 / 1024;

        return mbps;

    }

    catch(error) {

        console.error(error);

        return 0;

    }

}


/* =========================================
   ANIMATE SPEED
========================================= */

function animateSpeed(target) {

    const element =
        document.getElementById("mainSpeed");

    let current = 0;

    const duration = 1200;

    const startTime =
        performance.now();

    function animation(time) {

        const progress =
            Math.min(
                (time - startTime) / duration,
                1
            );

        current =
            target * progress;

        element.textContent =
            current.toFixed(1);

        if(progress < 1) {

            requestAnimationFrame(animation);

        }

        else {

            element.textContent =
                target.toFixed(2);

        }

    }

    requestAnimationFrame(animation);

}


/* =========================================
   START SPEED TEST
========================================= */

async function startTest() {

    const button =
        document.getElementById("startBtn");

    const status =
        document.getElementById("status");

    button.disabled = true;

    button.textContent =
        "⏳ TESTING...";

    document.getElementById("mainSpeed")
        .textContent = "0";

    document.getElementById("ping")
        .textContent = "-- ms";

    document.getElementById("download")
        .textContent = "-- Mbps";

    document.getElementById("upload")
        .textContent = "-- Mbps";


    /* PING */

    status.textContent =
        "📡 Ping পরীক্ষা করা হচ্ছে...";

    await pingTest();


    /* DOWNLOAD */

    status.textContent =
        "⬇️ Download Speed পরীক্ষা করা হচ্ছে...";

    const download =
        await downloadTest();

    document.getElementById("download")
        .textContent =
        download.toFixed(2) + " Mbps";

    animateSpeed(download);


    /* UPLOAD */

    status.textContent =
        "⬆️ Upload Speed পরীক্ষা করা হচ্ছে...";

    const upload =
        await uploadTest();

    document.getElementById("upload")
        .textContent =
        upload.toFixed(2) + " Mbps";


    /* COMPLETE */

    status.textContent =
        "✅ Speed Test সম্পন্ন হয়েছে!";

    button.disabled = false;

    button.textContent =
        "🔄 TEST AGAIN";

}


/* =========================================
   INITIAL LOAD
========================================= */

getNetworkInfo();

getBrowserInfo();

</script>

</body>
</html>
